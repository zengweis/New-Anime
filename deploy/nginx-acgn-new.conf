server {
    listen 80;
    listen [::]:80;
    server_name www.acgn.help acgn.help;

    root /opt/anime-new/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/anime-new.access.log;
    error_log  /var/log/nginx/anime-new.error.log;

    # ---------------- ACME 挑战（^~ 前缀匹配优先于正则，必须在跳转之前）----------------
    location ^~ /.well-known/acme-challenge/ {
        root /opt/anime-new/frontend/dist;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 用 listen ... http2 写法（1.25.1+ 才支持 "http2 on;"）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.acgn.help acgn.help;

    ssl_certificate     /etc/letsencrypt/live/www.acgn.help/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.acgn.help/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.acgn.help/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # 注：Let's Encrypt 自 2025 起已移除 OCSP URL，ssl_stapling 会产生 warn 且无效，故不启用

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/anime-new/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/anime-new.access.log;
    error_log  /var/log/nginx/anime-new.error.log;

    include /etc/nginx/snippets/anime-new-app.conf;
}
