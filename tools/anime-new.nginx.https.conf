server {
    server_name www.acgn.help;

    # HTTP/2（现代浏览器多路复用，加快 SPA 资源加载）
    http2 on;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/anime-new/frontend/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/anime-new.access.log;
    error_log  /var/log/nginx/anime-new.error.log;

    # ---------------- API 入口 ----------------
    location /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/anime-new/backend/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_read_timeout 300s;
        fastcgi_buffering on;
    }

    # ---------------- 视频流（PHP 鉴权 → X-Accel 交给 nginx 发文件）----------------
    location ~ ^/stream/(\d+)/?$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/anime-new/backend/public/stream.php;
        fastcgi_param SCRIPT_NAME     /stream.php;
        fastcgi_param QUERY_STRING    id=$1&$args;
        fastcgi_read_timeout 300s;
        fastcgi_buffering on;
    }

    # X-Accel-Redirect 的内部目标，外部不可直接访问
    location /protected/ {
        internal;
        alias /data/downloads/anime/;
    }

    # ---------------- 字幕（服务端抽好的 WebVTT）----------------
    # <track src> 带不了 Authorization 头，所以令牌走 query，由 PHP 鉴权后直发。
    # 文件只有几十 KB，不值得为它再开一条 internal 内网路径。
    location ~ ^/subtitle/(\d+)/(\d+)\.vtt$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /opt/anime-new/backend/public/subtitle.php;
        fastcgi_param SCRIPT_NAME     /subtitle.php;
        fastcgi_param QUERY_STRING    id=$1&track=$2&$args;
        fastcgi_read_timeout 60s;
        fastcgi_buffering on;
    }

    # ---------------- 前端静态 + SPA 回退 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anime.acgn.club/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anime.acgn.club/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.acgn.help) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.acgn.help;
    return 404; # managed by Certbot


}
